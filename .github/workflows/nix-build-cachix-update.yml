name: Build and push to Cachix

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nix-system: x86_64-linux
          # - os: ubuntu-24.04-arm
          #   nix-system: aarch64-linux
          # - os: macos-13
          #   nix-system: x86_64-darwin
          # - os: macos-latest
          #   nix-system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: kaivalagi
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build package
        run: nix build .#webzfs --system ${{ matrix.nix-system }} --print-build-logs

      - name: Pin build in Cachix
        run: |
          store_path=$(nix build .#webzfs --system ${{ matrix.nix-system }} --no-link --print-out-paths)
          for ((i = 1; i <= 24; i++)); do
            if cachix pin kaivalagi "webzfs-${{ matrix.nix-system }}" "$store_path" --keep-revisions 1; then
              echo "Pinned: $store_path as webzfs-${{ matrix.nix-system }}"
              exit 0
            fi
            echo "Push still in flight, retrying... ($i/24)"
            sleep 5
          done
          echo "Failed to pin store path" >&2
          exit 1

      - name: Verify dev shell
        run: nix develop --command echo "Dev shell OK"
